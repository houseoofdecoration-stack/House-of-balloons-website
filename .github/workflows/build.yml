name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name build
          git config user.email build@users.noreply.github.com
          git add -f index.html img robots.txt sitemap.xml
          git commit -m 'Build website files' || exit 0
          git push
